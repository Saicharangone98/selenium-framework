name: CI Smoke Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  smoke-tests:
    name: Build & Smoke Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Build and Smoke Tests
        run: |
          mvn clean test \
            -Denv=qa \
            -Dheadless=true \
            -Dexecution.mode=local \
            -DsuiteXmlFile=src/test/resources/testng.xml

      - name: Upload Smoke Test Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-reports
          path: |
            test-output/
            target/surefire-reports/
          retention-days: 7