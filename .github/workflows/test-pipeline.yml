name: Automation Regression Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Hybrid Test Suite
        run: |
          mvn clean test \
            -Dheadless=true \
            -Denv=qa \
            -DsuiteXmlFile=testng.xml

      - name: Archive Test Reports
        if: always() # Executes even if tests fail so reports can be examined
        uses: actions/upload-artifact@v4
        with:
          name: execution-reports
          path: |
            test-output/SparkReport/
            target/cucumber-reports/
          retention-days: 7