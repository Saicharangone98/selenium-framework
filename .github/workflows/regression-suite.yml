name: Automated Regression Suite
on:
  workflow_dispatch:
    inputs:
      env:
        description: Target Environment
        required: true
        default: qa
        type: choice
        options:
          - qa
          - stage
          - dev
      browser:
        description: Target Browser
        required: true
        default: chrome
        type: choice
        options:
          - chrome
          - firefox
      suiteXmlFile:
        description: TestNG Suite File
        required: true
        default: src/test/resources/testng.xml
        type: string
      headless:
        description: Run in Headless Mode
        required: true
        default: true
        type: boolean
jobs:
  regression-tests:
    name: Run Full Regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: Verify Environment & Tools
        run: |
          mvn -version
          google-chrome --version
      - name: Execute TestNG Regression Suite
        run: |
          mvn clean test \
            -Denv=${{ inputs.env }} \
            -Dbrowser=${{ inputs.browser }} \
            -Dheadless=${{ inputs.headless }} \
            -Dexecution.mode=local \
            -DsuiteXmlFile=${{ inputs.suiteXmlFile }}
      - name: Upload Test Results and Failure Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: execution-reports-and-screenshots
          path: |
            test-output/
            target/screenshots/
            target/surefire-reports/
          retention-days: 14
